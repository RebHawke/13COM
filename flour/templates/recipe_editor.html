{% extends "_layout.html" %}
{% block content %}

<h1> Editing: {{ recipe['name'] }}</h1>


<h2> Edit Recipe: </h2>
<form action="/edit-recipes-{{ recipe['id'] }}" method="POST">
    Name:
    <input type="text" name="name" maxlength="255" value= "{{ recipe['name'] }}"> <br>
    Image (paste a link):
    <input type="text" name="image" value= "{{ recipe['image'] }}"> <br>
    Skill:
    <select name="skill" id="skill" value= "{{ recipe['skill'] }}" class="selector">
        <option value="empty" selected disabled hidden>Choose Here</option>
        <option value="beginner">Beginner</option>
        <option value="intermediate">intermediate</option>
        <option value="advanced">Advanced</option> 
        <option value="any">N/A</option>
    </select> <br>
    <input type="hidden" name="recipe_id" value="{{ recipe['id'] }}"> <br>

    Featured:
    <select name="featured" id="featured" value= "{{ recipe['featured'] }}" class="selector">
        <option value="true">Featured</option>
        <option value="false">Not Featured</option>
    </select> <br>


    <input type="submit" value="submit">
</form>

{% endblock %}
